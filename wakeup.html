<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Wake-Up</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(ellipse at top, #1b1813, #0d0c0a);
    color: #e8e6e1; font-family: -apple-system, "Inter", system-ui, sans-serif;
    text-align: center; padding: 36px;
  }
  .kicker { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #9a948a; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 30px; margin: 0; }
  #play {
    width: 132px; height: 132px; border-radius: 50%;
    border: 2px solid #d8b25a; background: rgba(216,178,90,0.08); color: #d8b25a;
    font-size: 46px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; transition: transform .1s ease;
  }
  #play:active { transform: scale(0.95); }
  .bar { width: min(460px, 82vw); height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #d8b25a; transition: width .2s linear; }
  .hint { font-size: 14px; color: #9a948a; max-width: 320px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="kicker">Good morning</div>
  <h1>Your wake-up</h1>
  <div id="play" aria-label="Play">&#9654;</div>
  <div class="bar"><div id="fill"></div></div>
  <div class="hint" id="hint">Tap to begin — intro, poem, today's tasks, then your affirmations. About five minutes.</div>
  <audio id="a" preload="auto" playsinline></audio>
<script>
  var a = document.getElementById('a'),
      btn = document.getElementById('play'),
      fill = document.getElementById('fill'),
      hint = document.getElementById('hint');
  a.src = 'audio/wakeup-complete.mp3?t=' + Date.now(); // cache-bust so the phone always gets the latest
  function toggle() {
    if (a.paused) {
      a.play().then(function () { hint.textContent = 'Playing… tap to pause.'; }).catch(function () {});
    } else { a.pause(); }
  }
  btn.addEventListener('click', toggle);
  a.addEventListener('play', function () { btn.innerHTML = '&#10073;&#10073;'; });
  a.addEventListener('pause', function () { btn.innerHTML = '&#9654;'; });
  a.addEventListener('timeupdate', function () { if (a.duration) fill.style.width = (a.currentTime / a.duration * 100) + '%'; });
  a.addEventListener('ended', function () { btn.innerHTML = '&#9654;'; hint.textContent = "That's the morning. Go get it."; });
  a.play().catch(function () {}); // best-effort autoplay; blocked on iOS until the tap, which is fine
</script>
</body>
</html>
